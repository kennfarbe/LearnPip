# Production stack. Use --env-file deploy/.env.production -f deploy/compose.prod.yaml.
name: learnpip

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: learnpip
      POSTGRES_USER: learnpip
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnpip -d learnpip"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  migrate:
    profiles: [ops]
    image: kennfarbe/learnpip:api-${LEARNPIP_VERSION:?Set LEARNPIP_VERSION in deploy/.env.production}
    restart: "no"
    command: ["--migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      LEARNPIP_VERSION: ${LEARNPIP_VERSION}
      LearnPip__UpdateQueuePath: /var/lib/learnpip-update/queue
      LearnPip__UpdateStatusPath: /var/lib/learnpip-update/status
    secrets:
      - ConnectionStrings__LearnPip
    networks:
      - private
    depends_on:
      db:
        condition: service_healthy

  api:
    image: kennfarbe/learnpip:api-${LEARNPIP_VERSION:?Set LEARNPIP_VERSION in deploy/.env.production}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      LEARNPIP_VERSION: ${LEARNPIP_VERSION}
      LearnPip__UpdateQueuePath: /var/lib/learnpip-update/queue
      LearnPip__UpdateStatusPath: /var/lib/learnpip-update/status
      Authentication__PublicOrigin: https://${LEARNPIP_DOMAIN:?Set LEARNPIP_DOMAIN in deploy/.env.production}
      Mail__Host: ${LEARNPIP_MAIL_HOST:-}
      Mail__Port: ${LEARNPIP_MAIL_PORT:-587}
      Mail__From: ${LEARNPIP_MAIL_FROM:-}
      Mail__Username: ${LEARNPIP_MAIL_USERNAME:-}
      Oidc__Authority: ${LEARNPIP_OIDC_AUTHORITY:-}
      Oidc__ClientId: ${LEARNPIP_OIDC_CLIENT_ID:-}
      Oidc__PostLoginPath: ${LEARNPIP_OIDC_POST_LOGIN_PATH:-/}
      Ai__AllowedModes: ${LEARNPIP_AI_ALLOWED_MODES:-off}
      Ai__CloudEndpoint: ${LEARNPIP_AI_CLOUD_ENDPOINT:-}
      Ai__CloudModel: ${LEARNPIP_AI_CLOUD_MODEL:-}
      Ai__LocalEndpoint: ${LEARNPIP_AI_LOCAL_ENDPOINT:-}
      Ai__LocalModel: ${LEARNPIP_AI_LOCAL_MODEL:-}
      Ai__MaxInputBytes: ${LEARNPIP_AI_MAX_INPUT_BYTES:-8192}
      Ai__MaxImageBytes: ${LEARNPIP_AI_MAX_IMAGE_BYTES:-2097152}
      Ai__Quota__operator-cloud: ${LEARNPIP_AI_CLOUD_DAILY_QUOTA:-10}
      Ai__Quota__operator-local: ${LEARNPIP_AI_LOCAL_DAILY_QUOTA:-50}
      Ai__Quota__user-key: ${LEARNPIP_AI_USER_DAILY_QUOTA:-20}
    volumes:
      - ${LEARNPIP_SHARED_DIR:?Set LEARNPIP_SHARED_DIR in .env.production}/update-queue:/var/lib/learnpip-update/queue
      - ${LEARNPIP_SHARED_DIR:?Set LEARNPIP_SHARED_DIR in .env.production}/update-status:/var/lib/learnpip-update/status:ro
    secrets:
      - ConnectionStrings__LearnPip
      - Authentication__EmailCodeKey
      - Mail__Password
      - Oidc__ClientSecret
      - Ai__CloudKey
      - Ai__KeyEncryptionKey
    networks:
      - private
      - frontend
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "dotnet", "LearnPip.Api.dll", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  worker:
    image: kennfarbe/learnpip:worker-${LEARNPIP_VERSION:?Set LEARNPIP_VERSION in deploy/.env.production}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      Mail__Host: ${LEARNPIP_MAIL_HOST:-}
      Mail__Port: ${LEARNPIP_MAIL_PORT:-587}
      Mail__From: ${LEARNPIP_MAIL_FROM:-}
      Mail__Username: ${LEARNPIP_MAIL_USERNAME:-}
      Authentication__PublicOrigin: https://${LEARNPIP_DOMAIN:?Set LEARNPIP_DOMAIN in deploy/.env.production}
    secrets:
      - ConnectionStrings__LearnPip
      - Mail__Password
    networks:
      - private
      - frontend
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "dotnet", "LearnPip.Worker.dll", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  web:
    image: kennfarbe/learnpip:web-${LEARNPIP_VERSION:?Set LEARNPIP_VERSION in deploy/.env.production}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      LEARNPIP_DOMAIN: ${LEARNPIP_DOMAIN:?Set LEARNPIP_DOMAIN in deploy/.env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - frontend
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8081/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  private:
    internal: true
  frontend:

volumes:
  postgres-data:
  caddy-data:
  caddy-config:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  ConnectionStrings__LearnPip:
    file: ./secrets/ConnectionStrings__LearnPip
  Authentication__EmailCodeKey:
    file: ./secrets/Authentication__EmailCodeKey
  Mail__Password:
    file: ./secrets/Mail__Password
  Oidc__ClientSecret:
    file: ./secrets/Oidc__ClientSecret
  Ai__CloudKey:
    file: ./secrets/Ai__CloudKey
  Ai__KeyEncryptionKey:
    file: ./secrets/Ai__KeyEncryptionKey
