services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in deploy/.env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run ./scripts/dev-up.sh to generate a local password}
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["--migrate"]
    restart: "no"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__LearnPip: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__LearnPip: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Authentication__EmailCodeKey: ${LEARNPIP_EMAIL_CODE_KEY:-}
      Authentication__PublicOrigin: ${LEARNPIP_PUBLIC_ORIGIN:-}
      Mail__Host: ${LEARNPIP_MAIL_HOST:-}
      Mail__Port: ${LEARNPIP_MAIL_PORT:-587}
      Mail__From: ${LEARNPIP_MAIL_FROM:-}
      Mail__Username: ${LEARNPIP_MAIL_USERNAME:-}
      Mail__Password: ${LEARNPIP_MAIL_PASSWORD:-}
      Oidc__Authority: ${LEARNPIP_OIDC_AUTHORITY:-}
      Oidc__ClientId: ${LEARNPIP_OIDC_CLIENT_ID:-}
      Oidc__ClientSecret: ${LEARNPIP_OIDC_CLIENT_SECRET:-}
      Oidc__PostLoginPath: ${LEARNPIP_OIDC_POST_LOGIN_PATH:-/}
      Ai__AllowedModes: ${LEARNPIP_AI_ALLOWED_MODES:-off}
      Ai__CloudEndpoint: ${LEARNPIP_AI_CLOUD_ENDPOINT:-}
      Ai__CloudModel: ${LEARNPIP_AI_CLOUD_MODEL:-}
      Ai__CloudKey: ${LEARNPIP_AI_CLOUD_KEY:-}
      Ai__LocalEndpoint: ${LEARNPIP_AI_LOCAL_ENDPOINT:-}
      Ai__LocalModel: ${LEARNPIP_AI_LOCAL_MODEL:-}
      Ai__KeyEncryptionKey: ${LEARNPIP_AI_KEY_ENCRYPTION_KEY:-}
      Ai__MaxInputBytes: ${LEARNPIP_AI_MAX_INPUT_BYTES:-8192}
      Ai__MaxImageBytes: ${LEARNPIP_AI_MAX_IMAGE_BYTES:-2097152}
      Ai__Quota__operator-cloud: ${LEARNPIP_AI_CLOUD_DAILY_QUOTA:-10}
      Ai__Quota__operator-local: ${LEARNPIP_AI_LOCAL_DAILY_QUOTA:-50}
      Ai__Quota__user-key: ${LEARNPIP_AI_USER_DAILY_QUOTA:-20}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"

  worker:
    build:
      context: ..
      dockerfile: backend/src/LearnPip.Worker/Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__LearnPip: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Mail__Host: ${LEARNPIP_MAIL_HOST:-}
      Mail__Port: ${LEARNPIP_MAIL_PORT:-587}
      Mail__From: ${LEARNPIP_MAIL_FROM:-}
      Mail__Username: ${LEARNPIP_MAIL_USERNAME:-}
      Mail__Password: ${LEARNPIP_MAIL_PASSWORD:-}
      Authentication__PublicOrigin: ${LEARNPIP_PUBLIC_ORIGIN:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ..
      dockerfile: frontend/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:4200:80"

volumes:
  postgres-data:
