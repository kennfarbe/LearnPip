# Rootless Docker: do not grant privileged-port capabilities or lower sysctl limits.
# Forward public TCP 80->8080 and TCP/UDP 443->8443 to the VM at the router/proxy.
# Requires Docker Compose 2.24.4+ for !override.
services:
  proxy:
    ports: !override
      - "8080:80"
      - "8443:443"
      - "8443:443/udp"
