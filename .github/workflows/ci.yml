name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject tab characters in tracked text files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          files = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          violations = []
          for raw_path in files:
              if not raw_path:
                  continue
              path = Path(raw_path.decode("utf-8"))
              content = path.read_bytes()
              if b"\0" in content:
                  continue
              try:
                  text = content.decode("utf-8")
              except UnicodeDecodeError:
                  continue
              for number, line in enumerate(text.splitlines(), 1):
                  if "\t" in line:
                      violations.append(f"{path}:{number}: tab character; use spaces")
          if violations:
              print("\n".join(violations), file=sys.stderr)
              raise SystemExit(1)
          print("Tracked UTF-8 text files contain no tab characters.")
          PY

      - name: Check whitespace errors
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --check "$BASE_SHA...$PR_HEAD_SHA"
          elif [ "$EVENT_NAME" = "push" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "$BEFORE_SHA..$AFTER_SHA"
          fi

      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PY'
          import os
          import re
          title = os.environ["PR_TITLE"]
          pattern = re.compile(r"^(feat|fix|perf|refactor|build|ci|docs|style|test|chore|revert)(\([a-z0-9._/-]+\))?!?: .+")
          if not pattern.fullmatch(title):
              raise SystemExit(
                  "Use a Conventional Commit title, e.g. 'feat(web): add practice mode' "
                  "or 'docs: explain setup'."
              )
          PY

      - name: Validate pull request commit subjects
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          base = os.environ["BASE_SHA"]
          head = os.environ["PR_HEAD_SHA"]
          result = subprocess.run(
              ["git", "log", "--format=%s", f"{base}..{head}"],
              check=True, text=True, capture_output=True
          )
          pattern = re.compile(r"^(feat|fix|perf|refactor|build|ci|docs|style|test|chore|revert)(\([a-z0-9._/-]+\))?!?: .+")
          subjects = result.stdout.splitlines()
          if not subjects:
              raise SystemExit("Could not find pull request commit subjects.")
          invalid = [subject for subject in subjects if not pattern.fullmatch(subject)]
          if invalid:
              raise SystemExit("Use Conventional Commit subjects. Invalid: " + "; ".join(invalid))
          PY

      - name: Validate local Markdown links and pinned actions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import unquote
          import re
          import sys

          errors = []
          for document in Path(".").rglob("*.md"):
              if ".git" in document.parts:
                  continue
              text = document.read_text(encoding="utf-8")
              for match in re.finditer(r"(?<!!)\[[^\]]*\]\(([^)\s]+)(?:\s+[^)]*)?\)", text):
                  target = match.group(1)
                  if target.startswith(("https://", "http://", "mailto:", "#")):
                      continue
                  target_path = unquote(target.split("#", 1)[0])
                  if not target_path:
                      continue
                  resolved = (document.parent / target_path).resolve()
                  if not resolved.exists():
                      errors.append(f"{document}: missing local link target {target}")

          for workflow in Path(".github/workflows").glob("*.y*ml"):
              for line_number, line in enumerate(workflow.read_text(encoding="utf-8").splitlines(), 1):
                  match = re.match(r"\s*uses:\s*([^\s#]+)", line)
                  if not match:
                      continue
                  action = match.group(1)
                  if action.startswith("./"):
                      continue
                  if not re.fullmatch(r".+@[0-9a-f]{40}", action):
                      errors.append(f"{workflow}:{line_number}: pin actions to a full commit SHA")

          if errors:
              print("\n".join(errors), file=sys.stderr)
              raise SystemExit(1)
          print("Local Markdown links resolve and external actions use full commit SHAs.")
          PY

  markdown:
    name: Markdown lint (de-DE)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Install pinned Markdown tooling
        run: npm install --no-save --package-lock=false --ignore-scripts markdownlint-cli2@0.23.2 cspell@10.3.3 @cspell/dict-de-de@4.1.2
      - name: Lint Markdown structure
        run: npx --no-install markdownlint-cli2 "**/*.md"
      - name: Check German spelling in German project introduction
        run: npx --no-install cspell lint README.md --no-progress --no-summary

  backend:
    name: Backend build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: learnpip
          POSTGRES_USER: learnpip
          POSTGRES_PASSWORD: ci-only-learnpip-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U learnpip -d learnpip"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ConnectionStrings__LearnPip: Host=localhost;Port=5432;Database=learnpip;Username=learnpip;Password=ci-only-learnpip-password
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a solution when backend files are introduced
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          event = os.environ["EVENT_NAME"]
          if event == "pull_request":
              changed = subprocess.run(
                  ["git", "diff", "--name-only",
                   f"{os.environ['BASE_SHA']}...{os.environ['PR_HEAD_SHA']}"],
                  check=True, text=True, capture_output=True
              ).stdout.splitlines()
          elif event == "push" and os.environ["BEFORE_SHA"] != "0000000000000000000000000000000000000000":
              changed = subprocess.run(
                  ["git", "diff", "--name-only",
                   f"{os.environ['BEFORE_SHA']}..{os.environ['AFTER_SHA']}"],
                  check=True, text=True, capture_output=True
              ).stdout.splitlines()
          else:
              changed = []
          touched = any(path.startswith("backend/") for path in changed)
          solutions = list(Path("backend").rglob("*.sln")) + list(Path("backend").rglob("*.slnx")) if Path("backend").exists() else []
          if touched and not solutions:
              raise SystemExit("Backend files changed but no .sln or .slnx solution exists.")
          if not solutions:
              print("No backend solution exists yet; build will run when one is added.")
          PY

      - name: Set up .NET
        if: hashFiles('backend/**/*.sln', 'backend/**/*.slnx') != ''
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Test backend
        if: hashFiles('backend/**/*.sln', 'backend/**/*.slnx') != ''
        run: |
          solution="$(find backend -type f \( -name '*.sln' -o -name '*.slnx' \) -print -quit)"
          dotnet test "$solution" --configuration Release
          dotnet format whitespace "$solution" --verify-no-changes --no-restore
          dotnet format analyzers "$solution" --verify-no-changes --no-restore --severity error

  web:
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a lockfile when web files are introduced
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          event = os.environ["EVENT_NAME"]
          if event == "pull_request":
              changed = subprocess.run(
                  ["git", "diff", "--name-only",
                   f"{os.environ['BASE_SHA']}...{os.environ['PR_HEAD_SHA']}"],
                  check=True, text=True, capture_output=True
              ).stdout.splitlines()
          elif event == "push" and os.environ["BEFORE_SHA"] != "0000000000000000000000000000000000000000":
              changed = subprocess.run(
                  ["git", "diff", "--name-only",
                   f"{os.environ['BEFORE_SHA']}..{os.environ['AFTER_SHA']}"],
                  check=True, text=True, capture_output=True
              ).stdout.splitlines()
          else:
              changed = []
          touched = any(path.startswith("frontend/web/") for path in changed)
          lockfile = Path("frontend/web/package-lock.json")
          if touched and not lockfile.exists():
              raise SystemExit("Web files changed but frontend/web/package-lock.json is missing.")
          if not lockfile.exists():
              print("No web project exists yet; build will run when the web app is added.")
          PY

      - name: Set up Node
        if: hashFiles('frontend/web/package-lock.json') != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install web dependencies
        if: hashFiles('frontend/web/package-lock.json') != ''
        working-directory: frontend/web
        run: npm ci

      - name: Test and build web
        if: hashFiles('frontend/web/package-lock.json') != ''
        working-directory: frontend/web
        run: |
          npm test --if-present
          npm run docs:screenshots:check
          npm run format:check
          npm run lint
          npm run test:pwa
          npm run build --if-present 2>&1 | tee angular-build.log
          if grep -Eiq '(^|[[:space:]])(warning:|\\[WARNING\\])' angular-build.log; then
            echo 'Angular build emitted warnings; warnings are treated as errors.' >&2
            exit 1
          fi

      - name: Install browser for UI regression tests
        if: hashFiles('frontend/web/package-lock.json') != ''
        working-directory: frontend/web
        run: npx --no-install playwright install --with-deps chromium

      - name: Test workspace navigation and accessibility
        if: hashFiles('frontend/web/package-lock.json') != ''
        working-directory: frontend/web
        run: npm run test:ui

  installer-smoke:
    name: Installer smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test installer without network or real Docker
        run: |
          bash -n scripts/install-release.sh
          sudo python3 tests/ops/install-release-smoke.py

  release:
    name: Semantic release
    outputs:
      release_tag: ${{ steps.released.outputs.release_tag }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [repository-policy, markdown, backend, web, restore-smoke, installer-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Require release app configuration
        env:
          RELEASE_APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$RELEASE_APP_CLIENT_ID" ] || [ -z "$RELEASE_APP_PRIVATE_KEY" ]; then
            echo 'Configure RELEASE_APP_CLIENT_ID and RELEASE_APP_PRIVATE_KEY for the release GitHub App.' >&2
            exit 1
          fi
      - name: Create short-lived release token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Check out full history and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          token: ${{ steps.release-token.outputs.token }}
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install release tooling
        run: npm ci
      - name: Publish release
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          GIT_AUTHOR_NAME: learnpip-release-bot
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: learnpip-release-bot
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: npx semantic-release
      - name: Detect published release tag
        id: released
        run: |
          git fetch --force --tags origin
          release_tag="$(git tag --points-at HEAD | grep -E '^v[0-9]+[.][0-9]+[.][0-9]+$' | head -1 || true)"
          printf 'release_tag=%s\n' "$release_tag" >> "$GITHUB_OUTPUT"

  docker-publish:
    name: Publish Docker image (${{ matrix.component }})
    if: needs.release.outputs.release_tag != ''
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            dockerfile: backend/Dockerfile
          - component: worker
            dockerfile: backend/src/LearnPip.Worker/Dockerfile
          - component: web
            dockerfile: frontend/web/Dockerfile
    steps:
      - name: Check out released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.release.outputs.release_tag }}
          persist-credentials: false
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: kennfarbe
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build and push multi-platform image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            kennfarbe/learnpip:${{ matrix.component }}-${{ needs.release.outputs.release_tag }}
            kennfarbe/learnpip:${{ matrix.component }}-latest
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          sbom: true

  restore-smoke:
    name: Backup restore smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Restore synthetic private media and learning data
        run: ./tests/ops/restore-smoke.sh
