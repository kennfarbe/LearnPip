name: Dependency and image security audit

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * 0'
  pull_request:
    paths:
      - '.github/workflows/security.yml'
      - 'backend/**/*.csproj'
      - 'backend/**/*.props'
      - 'backend/**/*.sln'
      - 'frontend/web/package.json'
      - 'frontend/web/package-lock.json'
      - 'package.json'
      - 'package-lock.json'
      - 'backend/**/Dockerfile'
      - 'frontend/web/Dockerfile'
      - 'deploy/compose*.yaml'
      - 'deploy/*.Dockerfile'
      - 'scripts/security-report.py'
      - 'scripts/npm-security-audit.sh'
      - 'scripts/try-security-overrides.sh'
      - 'tests/ops/test_security*.py'
      - 'scripts/security-*.py'
      - 'security/**'
      - 'Directory.Build.props'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  inventory:
    name: Resolve supported releases and shipped image inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sources: ${{ steps.sources.outputs.matrix }}
      images: ${{ steps.images.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up pinned scanner runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - name: Exercise real advisory lookup and controlled scanner failure
        run: python3 scripts/security-scanner-selftest.py
      - name: Test inventory, report and ledger failures
        run: python3 -m unittest discover -s tests/ops -p 'test_security*.py' -v
      - name: Resolve sources
        id: sources
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ] || [ "$EVENT" = pull_request ]; then
            python3 scripts/security-inventory.py --output "$RUNNER_TEMP/sources.json" >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"include":[{"ref":"","label":"main"}]}' >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Buildx for manifest inspection
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Resolve immutable image digests for every supported platform
        id: images
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/security-inventory.py --images --resolved-sources "$RUNNER_TEMP/sources.json" --output "$RUNNER_TEMP/images.json" >> "$GITHUB_OUTPUT"
      - name: Keep datestamped inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-inventory
          path: |
            ${{ runner.temp }}/sources.json
            ${{ runner.temp }}/images.json
          retention-days: 14
          if-no-files-found: ignore

  dependencies:
    name: NuGet and npm audit (${{ matrix.label }})
    needs: inventory
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.inventory.outputs.sources) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check out audited source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.ref }}
          path: source
          persist-credentials: false

      - name: Test aggregate scanner parser
        run: python3 -m unittest discover -s tests/ops -p 'test_security_report.py' -v

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.401

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0

      - name: Audit root and Angular dependencies; test safe lockfile fixes
        id: npm_audit
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          status=0
          bash scripts/npm-security-audit.sh source root production || status=1
          bash scripts/npm-security-audit.sh source/frontend/web web production || status=1
          bash scripts/npm-security-audit.sh source root development || status=1
          bash scripts/npm-security-audit.sh source/frontend/web web development || status=1
          exit "$status"

      - name: Trial targeted transitive overrides without changing checkout
        if: always()
        shell: bash
        run: bash scripts/try-security-overrides.sh

      - name: Upload override trial candidate for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-override-trial-${{ matrix.label }}
          path: |
            ${{ runner.temp }}/learnpip-override-trial/package.json
            ${{ runner.temp }}/learnpip-override-trial/package-lock.json
            ${{ runner.temp }}/learnpip-override-trial/override-audit.json
          if-no-files-found: warn
          retention-days: 14

      - name: Restore NuGet graph
        shell: bash
        run: |
          if ! dotnet restore source/backend/LearnPip.sln > "$RUNNER_TEMP/nuget-restore.log" 2>&1; then
            echo "NuGet restore incomplete. Inspect locally; no scan success claimed." >&2
            exit 1
          fi

      - name: Scan direct and transitive NuGet packages
        shell: bash
        run: |
          if ! dotnet list source/backend/LearnPip.sln package --vulnerable --include-transitive --format json > "$RUNNER_TEMP/nuget.json" 2> "$RUNNER_TEMP/nuget-error.log"; then
            echo "NuGet vulnerability scan incomplete. Inspect locally." >&2
            exit 1
          fi
          python3 scripts/security-report.py nuget "$RUNNER_TEMP/nuget.json"

      - name: Collect complete scanner reports
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/security-reports"
          for component in root web; do
            for scope in production development; do
              source="$RUNNER_TEMP/learnpip-security-$component-$scope"
              if [ -d "$source" ]; then
                for name in npm-audit-private.json npm-after-fix-private.json npm-fix-private.json; do
                  if [ -f "$source/$name" ]; then
                    cp "$source/$name" "$RUNNER_TEMP/security-reports/$component-$scope-$name"
                  fi
                done
              fi
            done
          done
          if [ -f "$RUNNER_TEMP/nuget.json" ]; then
            cp "$RUNNER_TEMP/nuget.json" "$RUNNER_TEMP/security-reports/nuget.json"
          fi

      - name: Record complete scanner targets for deduplicated ledger
        if: always()
        env:
          AUDIT_TARGET: ${{ matrix.label }}
        run: python3 scripts/security-scan-metadata.py dependencies "$RUNNER_TEMP/security-reports"

      - name: Upload full audit reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-security-reports-${{ matrix.label }}
          path: ${{ runner.temp }}/security-reports/*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce complete dependency audit result
        if: always()
        shell: bash
        env:
          NPM_OUTCOME: ${{ steps.npm_audit.outcome }}
        run: |
          if [ "$NPM_OUTCOME" != success ]; then
            echo 'npm vulnerability audit remains unresolved; job stays blocked.' >&2
            exit 1
          fi

  published-images:
    name: Published image audit (${{ matrix.label }})
    needs: inventory
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.inventory.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Scan published image by immutable platform digest
        id: scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ matrix.ref }}
          version: v0.74.0
          format: json
          output: ${{ runner.temp }}/trivy.json
          scanners: vuln
          vuln-type: os,library
          hide-progress: true
          cache: false
          exit-code: '0'
      - name: Verify advisory database age
        run: |
          trivy --cache-dir "$GITHUB_WORKSPACE/.cache/trivy" --version --format json > "$RUNNER_TEMP/trivy-version.json"
          python3 scripts/security-db-age.py "$RUNNER_TEMP/trivy-version.json"
      - name: Record scan and inventory
        if: always()
        env:
          AUDIT_TARGET: published-${{ matrix.label }}
          AUDIT_REF: ${{ matrix.ref }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: python3 scripts/security-scan-metadata.py trivy "$RUNNER_TEMP"
      - name: Retain image report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-security-reports-${{ matrix.label }}
          path: |
            ${{ runner.temp }}/trivy.json
            ${{ runner.temp }}/trivy-version.json
            ${{ runner.temp }}/scan-trivy.json
          retention-days: 14
      - name: Enforce production findings
        run: python3 scripts/security-report.py trivy "$RUNNER_TEMP/trivy.json"

  candidate-images:
    name: Release image gate (${{ matrix.component }}, ${{ matrix.arch }})
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        component: [api, worker, web, db, proxy, build-sdk, build-node, build-go]
        include:
          - component: api
            dockerfile: backend/Dockerfile
          - component: worker
            dockerfile: backend/src/LearnPip.Worker/Dockerfile
          - component: web
            dockerfile: frontend/web/Dockerfile
          - component: db
            dockerfile: deploy/postgres.Dockerfile
          - component: proxy
            image: caddy:2-alpine
          - component: build-sdk
            image: mcr.microsoft.com/dotnet/sdk:10.0
          - component: build-node
            image: node:24.21.0-alpine3.24
          - component: build-go
            image: golang:1.26.8-alpine3.24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build or pull release candidate
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
        run: |
          if [ -n "$DOCKERFILE" ]; then
            docker buildx build --platform "linux/$ARCH" --load -f "$DOCKERFILE" -t learnpip-security:candidate .
          else
            docker pull --platform "linux/$ARCH" "$IMAGE"
            docker tag "$IMAGE" learnpip-security:candidate
          fi
      - name: Audit candidate before publishing
        id: scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: learnpip-security:candidate
          version: v0.74.0
          format: json
          output: ${{ runner.temp }}/trivy.json
          scanners: vuln
          vuln-type: os,library
          hide-progress: true
          cache: false
          exit-code: '0'
      - name: Verify advisory database age
        run: |
          trivy --cache-dir "$GITHUB_WORKSPACE/.cache/trivy" --version --format json > "$RUNNER_TEMP/trivy-version.json"
          python3 scripts/security-db-age.py "$RUNNER_TEMP/trivy-version.json"
      - name: Record candidate scan
        if: always()
        env:
          AUDIT_TARGET: candidate-${{ github.sha }}-${{ matrix.component }}-${{ matrix.arch }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: python3 scripts/security-scan-metadata.py trivy "$RUNNER_TEMP"
      - name: Retain candidate report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-security-reports-candidate-${{ matrix.component }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/trivy.json
            ${{ runner.temp }}/trivy-version.json
            ${{ runner.temp }}/scan-trivy.json
          retention-days: 14
      - name: Enforce release gate
        run: python3 scripts/security-report.py trivy "$RUNNER_TEMP/trivy.json"

  ledger:
    name: Deduplicate and verify security findings
    needs: [inventory, dependencies, published-images, candidate-images]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download scan artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: '*security-reports-*'
          path: reports
      - name: Read last scheduled ledger without publishing tickets
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: kennfarbe/LearnPip
        run: python3 scripts/security-previous-ledger.py previous.json
      - name: Reconcile findings only for complete targets
        run: python3 scripts/security-ledger.py --reports reports --previous previous.json --output security-ledger.json
      - name: Retain ledger for next scheduled scan
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-ledger
          path: security-ledger.json
          retention-days: 14
      - name: Require complete scans and passing release gates
        if: always()
        env:
          INVENTORY: ${{ needs.inventory.result }}
          DEPENDENCIES: ${{ needs.dependencies.result }}
          IMAGES: ${{ needs.published-images.result }}
          CANDIDATES: ${{ needs.candidate-images.result }}
        run: |
          test "$INVENTORY" = success
          test "$DEPENDENCIES" = success
          test "$IMAGES" = success || test "$IMAGES" = skipped
          test "$CANDIDATES" = success || test "$CANDIDATES" = skipped
          test "$IMAGES" = success || test "$CANDIDATES" = success
