name: Validate Dependabot documentation screenshots

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: dependabot-screenshots-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  screenshots:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Only trusted default-branch code runs with write credentials.
      - name: Check out trusted automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Validate Dependabot PR and completed CI artifact
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/dependabot-screenshots.py prepare
      - name: Download screenshot data from the validated CI run
        if: steps.prepare.outputs.eligible == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dependabot-screenshots
          path: ${{ runner.temp }}/dependabot-screenshots
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      # Keep Dependabot branches bot-owned so Dependabot can rebase them.
      # Screenshots remain CI artifacts; changes to tracked screenshots belong
      # in a separate documentation PR, not a dependency update.
      - name: Validate downloaded screenshots (read-only)
        if: steps.prepare.outputs.eligible == 'true'
        env:
          SCREENSHOT_DIRECTORY: ${{ runner.temp }}/dependabot-screenshots
        run: python3 scripts/dependabot-screenshots.py verify "$SCREENSHOT_DIRECTORY"
