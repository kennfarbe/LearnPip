name: Update Dependabot documentation screenshots

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: dependabot-screenshots-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  screenshots:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Only trusted default-branch code runs with write credentials.
      - name: Check out trusted automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Validate Dependabot PR and completed CI artifact
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/dependabot-screenshots.py prepare
      - name: Download screenshot data from the validated CI run
        if: steps.prepare.outputs.eligible == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dependabot-screenshots
          path: ${{ runner.temp }}/dependabot-screenshots
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Create short-lived screenshot commit token
        if: steps.prepare.outputs.eligible == 'true'
        id: commit-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Validate data and commit screenshots without overwriting newer work
        if: steps.prepare.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ steps.commit-token.outputs.token }}
          GH_TOKEN_READ: ${{ github.token }}
          SCREENSHOT_DIRECTORY: ${{ runner.temp }}/dependabot-screenshots
        run: python3 scripts/dependabot-screenshots.py publish "$SCREENSHOT_DIRECTORY"
