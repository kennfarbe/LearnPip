name: One-time LearnPip design screenshots
on:
  push:
    branches: [design/apple-inspired-ui]

permissions:
  contents: write

jobs:
  screenshots:
    if: github.repository == 'kennfarbe/LearnPip' && github.ref == 'refs/heads/design/apple-inspired-ui'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: design/apple-inspired-ui
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - name: Install web dependencies
        working-directory: frontend/web
        run: npm ci
      - name: Install browser
        working-directory: frontend/web
        run: npx --no-install playwright install --with-deps chromium
      - name: Regenerate documentation screenshots
        working-directory: frontend/web
        run: |
          npm run docs:screenshots
          npm run docs:screenshots:check
      - name: Commit screenshots and remove temporary workflow
        run: |
          set -euo pipefail
          rm .github/workflows/learnpip-design-screenshots.yml
          git add docs/screenshots/ .github/workflows/learnpip-design-screenshots.yml
          git diff --cached --quiet && { echo "No screenshot changes produced"; exit 1; }
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs(web): refresh screenshots for Apple-inspired design'
          git push origin HEAD:refs/heads/design/apple-inspired-ui
